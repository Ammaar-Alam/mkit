<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MKit</title>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="masthead">
        <img
          class="folio-mark"
          src="../icons/icon-48.png"
          width="40"
          height="40"
          alt=""
          aria-hidden="true"
        >
        <span>
          <span class="eyebrow">The MCAT Kit</span>
          <strong>MKit</strong>
        </span>
        <span id="page-state" class="page-state">Checking page</span>
      </header>

      <section id="mkit-control" class="master-control" aria-labelledby="mkit-toggle-label">
        <label class="switch-row">
          <span class="switch-copy">
            <strong id="mkit-toggle-label">MKit</strong>
            <span id="mkit-state" class="switch-state">On</span>
          </span>
          <input id="mkit-enabled" class="switch" type="checkbox">
        </label>
      </section>

      <section aria-labelledby="page-heading" class="page-context">
        <span id="page-heading" class="eyebrow">This page</span>
        <strong id="page-status">Checking this page</strong>
        <span id="page-detail" class="page-detail">Looking for a completed review.</span>
      </section>

      <section id="protection-section" aria-labelledby="protection-heading" class="section section--settings">
        <h2 id="protection-heading">Review settings</h2>
        <label class="switch-row">
          <span class="switch-copy">
            <strong>Hide section result marks</strong>
            <span id="result-marks-state" class="switch-state">On</span>
          </span>
          <input id="hide-section-result-marks" class="switch" type="checkbox">
        </label>
        <label class="switch-row">
          <span class="switch-copy">
            <strong>Clear previous highlights</strong>
            <span id="highlights-state" class="switch-state">On</span>
          </span>
          <input id="clear-previous-highlights" class="switch" type="checkbox">
        </label>
        <label class="switch-row">
          <span class="switch-copy">
            <strong>Clear previous cross-outs</strong>
            <span id="cross-outs-state" class="switch-state">On</span>
          </span>
          <input id="clear-previous-cross-outs" class="switch" type="checkbox">
        </label>
        <label class="switch-row">
          <span class="switch-copy">
            <strong>Score Shield</strong>
            <span id="shield-state" class="switch-state">On</span>
          </span>
          <input id="score-shield" class="switch" type="checkbox">
        </label>
        <label class="switch-row">
          <span class="switch-copy">
            <strong>First-attempt checks</strong>
            <span id="initial-correctness-state" class="switch-state">Off</span>
          </span>
          <input id="show-initial-correctness" class="switch" type="checkbox">
        </label>
      </section>

      <section id="continue-section" aria-labelledby="continue-heading" class="section section--sessions">
        <h2 id="continue-heading">Active attempt</h2>
        <div id="active-sessions" class="session-list" aria-live="polite"></div>
      </section>

      <section id="history-section" aria-labelledby="history-heading" class="section section--sessions">
        <h2 id="history-heading">History</h2>
        <div id="session-history" class="session-list"></div>
      </section>

      <section aria-labelledby="storage-heading" class="storage-row">
        <span>
          <span id="storage-heading" class="eyebrow">Storage</span>
          <strong id="storage-state">Saved on this device</strong>
          <span id="storage-detail" class="storage-detail"></span>
        </span>
        <span id="save-status" role="status" aria-live="polite"></span>
      </section>

      <button id="open-settings" class="button-link" type="button">All settings</button>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
