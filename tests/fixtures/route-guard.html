<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MKit route-guard fixture</title>
    <link rel="stylesheet" href="/preflight.css">
    <script>
      const startupParams = new URL(location.href).searchParams;
      if (startupParams.has("stale-route")) {
        document.documentElement.dataset.mkitRoute = "answer-review";
      }
      if (startupParams.has("stale-protection")) {
        document.documentElement.dataset.mkitProtection = "boot";
      }
    </script>
    <script src="/route-guard-entry.js"></script>
  </head>
  <body>
    <div id="wrapper">
      <main id="dashboard-root" data-dashboard-state="authored">
        <section class="score-reports-wrapper">Synthetic stale score shell.</section>
        <article class="luca-ui-card">
          <div class="reviewable">
            <div
              class="question-content-container"
              data-exam-id="synthetic-exam"
              data-question-id="synthetic-question"
              data-section-id="cp"
            >
              <div class="answer-set-content">
                <div
                  class="answer-container correct is-hidden question-container"
                  style="visibility: hidden"
                >
                  <div id="dashboard-question-workspace" style="visibility: visible">
                    <p id="dashboard-question">Synthetic stale question-like node.</p>
                    <div class="multi-choice incorrect" data-choice="D">
                      Synthetic stale choice A.
                    </div>
                    <div class="multi-choice correct" data-choice="A">
                      Synthetic stale choice B.
                    </div>
                    <div class="multi-choice" data-choice="B">Synthetic stale choice C.</div>
                    <div class="multi-choice" data-choice="C">Synthetic stale choice D.</div>
                  </div>
                </div>
                <div class="fixed-width-sidebar-columns">
                  <aside class="sidebar-column">
                    <div class="sidebar-container">
                      <div class="choices-container">
                        <section class="result-wrapper">
                          <div class="result is-incorrect">Synthetic stale result.</div>
                        </section>
                      </div>
                    </div>
                  </aside>
                </div>
                <section class="expander-content">Synthetic stale explanation.</section>
              </div>
              <nav class="icon-bar navigate">
                <button class="toolbar-btn previous" type="button">Previous</button>
                <button class="toolbar-btn next" type="button">Next</button>
              </nav>
            </div>
          </div>
          <div class="external-review-controls">
            <label class="review-answer">
              Review
              <input
                class="view-answers switchable"
                role="switch"
                type="checkbox"
                aria-checked="false"
              >
            </label>
            <label class="review-answer" style="display: none">
              Review
              <input
                class="view-answers switchable"
                role="switch"
                type="checkbox"
                aria-checked="false"
              >
            </label>
          </div>
        </article>
        <aside class="reviewable" id="secondary-review-shell">
          <div class="choices-container">
            <section class="result-wrapper">
              <div class="result">Synthetic secondary review shell.</div>
            </section>
          </div>
        </aside>
      </main>
    </div>
    <footer id="main-footer" data-footer-state="authored">Synthetic footer shell.</footer>
    <script>
      const fixtureParams = new URL(location.href).searchParams;
      if (fixtureParams.has("missing-capability")) {
        for (const input of document.querySelectorAll(".view-answers.switchable")) {
          input.remove();
        }
      }
      if (fixtureParams.has("ambiguous-switch")) {
        for (const label of document.querySelectorAll(".external-review-controls label")) {
          label.removeAttribute("style");
        }
      }
      if (fixtureParams.has("incomplete-choices")) {
        document.querySelector(".multi-choice:last-of-type")?.remove();
      }
      window.__mkitRouteGuardAuthoredMarkup = document.querySelector("#dashboard-root").outerHTML;
      window.__mkitRouteGuardAuthoredSurface = [
        document.querySelector("#wrapper").outerHTML,
        document.querySelector("#main-footer").outerHTML,
      ].join("");
      window.__mkitRouteGuardSyncDisplay = getComputedStyle(
        document.querySelector("#wrapper"),
      ).display;
      window.__mkitRouteGuardSyncFooterDisplay = getComputedStyle(
        document.querySelector("#main-footer"),
      ).display;
      window.__mkitRouteGuardSyncQuestionVisibility = getComputedStyle(
        document.querySelector("#dashboard-question-workspace"),
      ).visibility;
    </script>
  </body>
</html>
