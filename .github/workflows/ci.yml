name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chrome for synthetic browser checks
        run: pnpm exec playwright install --with-deps chrome

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run synthetic Chrome privacy tests
        run: pnpm test:browser

      - name: Build extension
        run: pnpm build

      - name: Audit release contents
        run: pnpm audit:release

      - name: Package extension
        run: pnpm package

      - name: Upload packaged extension
        uses: actions/upload-artifact@v5
        with:
          name: mkit-package
          path: release/mkit-*.zip
          if-no-files-found: error
          retention-days: 14
